<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>4. 장바구니</title>
<link rel="stylesheet" href="_base.css">
</head>
<body>
<header class="top"><button class="icon-btn" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="title">장바구니<small class="num">1</small></div><span style="width:44px"></span></header>
<div class="card">
  <div class="progress-label"><b class="num">₩12,000</b> 더 담으면 무료배송</div>
  <div class="progress"><i style="width:76%"></i></div>
</div>
<div class="card">
  <div class="item">
    <div class="thumb" data-illust><div class="bottle"><i class="cap"></i><i class="neck"></i><i class="bod"></i></div></div>
    <div class="t"><b>데일리 텀블러 500ml</b><span>세이지 · 500ml</span><span class="p num">₩38,000</span></div>
    <div class="stepper"><button aria-label="수량 줄이기">−</button><span class="num">1</span><button aria-label="수량 늘리기">+</button></div>
  </div>
</div>
<div class="sec">함께 담으면 무료배송</div>
<div class="reco">
  <button><div class="ph"></div><b>실리콘 스트랩</b><span class="num">₩9,000</span></button>
  <button><div class="ph"></div><b>리드 교체 세트</b><span class="num">₩12,000</span></button>
</div>
<div class="cta-bar" style="align-items:center">
  <div class="sum"><span>배송비 포함</span><b class="num">₩41,000</b></div>
  <button class="btn primary grow0">주문하기</button>
</div>
</body>
</html>
