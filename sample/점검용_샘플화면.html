<!-- 점검용 샘플 화면 — 사전 준비 3단계(스크린샷 테스트)에만 사용합니다 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환경 점검 — 모두의회의실</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif; background:#F4F6F8; color:#191F28; }
  .wrap { max-width:480px; margin:0 auto; min-height:100vh; background:#fff; padding:24px 20px; box-sizing:border-box; }
  h1 { font-size:22px; line-height:30px; margin:0 0 8px; }
  p { font-size:16px; line-height:24px; color:#333D4B; margin:0 0 24px; }
  .card { border:1px solid #E5E8EB; border-radius:12px; padding:16px; margin-bottom:12px; }
  .card h2 { font-size:18px; line-height:26px; margin:0 0 4px; }
  .card span { font-size:13px; color:#6B7684; }
  .ok { display:inline-block; margin-top:8px; font-size:14px; font-weight:500; color:#12A150; }
  button { width:100%; height:52px; border:0; border-radius:12px; background:#2E5BFF; color:#fff; font-size:16px; font-weight:700; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>환경 점검 완료 🎉</h1>
  <p>이 화면의 스크린샷이 shots/ 폴더에 생겼다면, 워크숍 실습 준비가 끝났어요.</p>
  <div class="card"><h2>Claude Code</h2><span>로그인 및 실행</span><br><span class="ok">✓ 확인됨</span></div>
  <div class="card"><h2>에이전트 4종</h2><span>designer · reviewer · qa · director</span><br><span class="ok">✓ 인식됨</span></div>
  <div class="card"><h2>스크린샷 스킬</h2><span>Playwright 렌더링</span><br><span class="ok">✓ 지금 이 이미지가 증거예요</span></div>
  <button type="button">10월 30일에 만나요</button>
</div>
</body>
</html>
